services:
  postgres:
    image: postgres:16-alpine
    container_name: salesos-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s
    networks:
      - salesos

  redis:
    image: redis:7-alpine
    container_name: salesos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1 --loglevel warning --dir /data
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s
    networks:
      - salesos

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: salesos-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/salesos/packages/shared/python:/workspace/salesos/packages/config/python:/workspace/salesos/apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/workspace/salesos
    command: sh -lc "python /workspace/salesos/scripts/wait_for_services.py --service postgres --service redis --service ollama --timeout ${STARTUP_DEPENDENCY_TIMEOUT_SECONDS:-60} --interval ${STARTUP_DEPENDENCY_POLL_SECONDS:-2} && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/ready || exit 1"]
      start_period: 45s
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 15s
    networks:
      - salesos

  telegram-bot:
    build:
      context: .
      dockerfile: infrastructure/docker/telegram-bot/Dockerfile
    container_name: salesos-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/salesos/packages/shared/python:/workspace/salesos/packages/config/python:/workspace/salesos/apps/telegram-bot
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${TELEGRAM_BOT_PORT:-8080}:8080"
    volumes:
      - ./:/workspace/salesos
    command: sh -lc "python /workspace/salesos/scripts/wait_for_services.py --service redis --timeout ${STARTUP_DEPENDENCY_TIMEOUT_SECONDS:-60} --interval ${STARTUP_DEPENDENCY_POLL_SECONDS:-2} && uvicorn bot.main:app --host 0.0.0.0 --port 8080 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ready || exit 1"]
      start_period: 20s
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s
    networks:
      - salesos

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard/Dockerfile
    container_name: salesos-dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./apps/dashboard:/app
      - dashboard_node_modules:/app/node_modules
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      start_period: 30s
      interval: 20s
      timeout: 5s
      retries: 10
    stop_grace_period: 10s
    networks:
      - salesos

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: salesos-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678 >/dev/null 2>&1 || exit 1"]
      start_period: 30s
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - salesos

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  dashboard_node_modules:

networks:
  salesos:
    driver: bridge
